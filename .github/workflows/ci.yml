name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.2", laravel: "11.*", testbench: "9.*", phpunit: "11.*" }
          - { php: "8.3", laravel: "12.*", testbench: "10.*", phpunit: "11.*" }
          - { php: "8.4", laravel: "13.*", testbench: "11.*", phpunit: "12.*" }
    name: Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: >-
          composer require --no-interaction --no-update
          "illuminate/support:${{ matrix.laravel }}" "illuminate/view:${{ matrix.laravel }}"
      - run: >-
          composer require --dev --no-interaction --no-update
          "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
